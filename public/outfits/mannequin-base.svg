<svg width="400" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Body torso -->
  <ellipse cx="200" cy="320" rx="60" ry="90" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1"/>
  
  <!-- Neck -->
  <ellipse cx="200" cy="190" rx="25" ry="35" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1"/>
  
  <!-- Left arm -->
  <ellipse cx="130" cy="280" rx="20" ry="80" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1" transform="rotate(-20 130 280)"/>
  <ellipse cx="105" cy="360" rx="18" ry="50" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1" transform="rotate(-15 105 360)"/>
  
  <!-- Right arm -->
  <ellipse cx="270" cy="280" rx="20" ry="80" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1" transform="rotate(20 270 280)"/>
  <ellipse cx="295" cy="360" rx="18" ry="50" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1" transform="rotate(15 295 360)"/>
  
  <!-- Left leg -->
  <ellipse cx="180" cy="430" rx="25" ry="120" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1"/>
  <ellipse cx="175" cy="560" rx="22" ry="35" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1"/>
  
  <!-- Right leg -->
  <ellipse cx="220" cy="430" rx="25" ry="120" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1"/>
  <ellipse cx="225" cy="560" rx="22" ry="35" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1"/>
  
  <!-- Head area (transparent for face overlay) -->
  <circle cx="200" cy="140" r="55" fill="none"/>
</svg>
